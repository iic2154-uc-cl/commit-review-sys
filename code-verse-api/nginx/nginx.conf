# Redirect HTTP to HTTPS (if needed)
server {
    listen 80;
    listen [::]:80 default_server;

    server_name aicommit.ing.puc.cl;  # Default server name

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server configuration
server {
    listen 443 ssl;
    server_name aicommit.ing.puc.cl;  # Replace with your domain if necessary

    # SSL configuration from Certbot (you should have SSL certificates already)
    ssl_certificate /etc/letsencrypt/live/aicommit.ing.puc.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicommit.ing.puc.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend (Vue.js app)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend (Express app)
    location /api/ {
        proxy_pass http://localhost:8080/api/;  # API running on port 8080
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger and API Docs
    location /v1 {
        proxy_pass http://localhost:8080/v1;
    }

    location /auth {
        proxy_pass http://localhost:8080/auth;
    }
}