version: '3.8'

services:
  db:
    image: postgres:15
    container_name: express-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    build: .
    container_name: express-api
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db
    restart: always
    networks:
      - backend

volumes:
  db-data:

networks:
  backend:
